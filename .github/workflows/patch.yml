name: Patch

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch that contains the Changesets and will receive the version PR
        required: true
        type: string

concurrency:
  group: patch-${{ inputs.target_branch }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  patch:
    name: Create version PR
    runs-on: ubuntu-latest
    steps:
      - name: Require the trusted default-branch workflow
        shell: bash
        env:
          WORKFLOW_BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$WORKFLOW_BRANCH" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::Run Patch from the default branch and select the source with target_branch."
            exit 1
          fi

      - name: Check out the target branch
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Require at least one effective Changeset
        shell: bash
        run: |
          set -euo pipefail
          status_file="$(mktemp)"
          pnpm changeset status --output "$status_file"
          node - "$status_file" <<'NODE'
          const fs = require('node:fs')
          const status = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          if (!Array.isArray(status.releases) || status.releases.length === 0) {
            console.error('::error::The target branch must contain at least one Changeset that bumps a public package.')
            process.exit(1)
          }
          NODE

      - name: Consume Changesets and bump independent packages
        shell: bash
        run: |
          set -euo pipefail
          before_file="$(mktemp)"
          after_file="$(mktemp)"
          node - "$before_file" <<'NODE'
          const fs = require('node:fs')
          const paths = [
            'packages/acplugin/package.json',
            'packages/platforms/claude-code/package.json',
            'packages/platforms/codex/package.json',
            'packages/platforms/cursor/package.json',
            'packages/platforms/antigravity/package.json',
            'packages/platforms/opencode/package.json',
            'packages/platforms/pi/package.json',
            'packages/extensions/hooks/package.json',
            'packages/extensions/mcp/package.json',
          ]
          fs.writeFileSync(process.argv[2], JSON.stringify(Object.fromEntries(paths.map(file => {
            const manifest = require(`./${file}`)
            return [manifest.name, manifest.version]
          }))))
          NODE
          pnpm version-packages
          node - "$after_file" <<'NODE'
          const fs = require('node:fs')
          const paths = [
            'packages/acplugin/package.json',
            'packages/platforms/claude-code/package.json',
            'packages/platforms/codex/package.json',
            'packages/platforms/cursor/package.json',
            'packages/platforms/antigravity/package.json',
            'packages/platforms/opencode/package.json',
            'packages/platforms/pi/package.json',
            'packages/extensions/hooks/package.json',
            'packages/extensions/mcp/package.json',
          ]
          fs.writeFileSync(process.argv[2], JSON.stringify(Object.fromEntries(paths.map(file => {
            const manifest = require(`./${file}`)
            return [manifest.name, manifest.version]
          }))))
          NODE
          node - "$before_file" "$after_file" <<'NODE'
          const fs = require('node:fs')
          const before = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          const after = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'))
          if (!Object.keys(after).some(name => before[name] !== after[name])) {
            console.error('::error::The Changesets did not bump any public package.')
            process.exit(1)
          }
          NODE
          pnpm install --lockfile-only

      - run: pnpm run lint
      - run: pnpm run typecheck

      - name: Create or update the version PR
        id: version-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          base: ${{ inputs.target_branch }}
          branch: changeset-version/${{ inputs.target_branch }}
          delete-branch: true
          commit-message: "chore(release): version packages"
          title: "chore(release): version packages"
          body: |
            Consumes the Changesets from `${{ inputs.target_branch }}` and updates the independently versioned public packages and changelogs.

            This pull request does not publish packages, create tags, or create a GitHub Release.

      - name: Report pull request
        if: steps.version-pr.outputs.pull-request-url
        run: echo "Created or updated ${{ steps.version-pr.outputs.pull-request-url }}"
