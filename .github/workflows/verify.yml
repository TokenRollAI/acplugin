name: Verify

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    name: Build and verify tarballs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Verify and retain the public packages
        run: pnpm run release:verify -- --tarball-dir "$RUNNER_TEMP/acplugin-tarballs"
      - name: Upload the exact verified tarballs
        uses: actions/upload-artifact@v7
        with:
          name: acplugin-verified-tarballs
          path: ${{ runner.temp }}/acplugin-tarballs/*.tgz
          if-no-files-found: error
          retention-days: 7

  node-20-consumer:
    name: Consume tarballs on Node 20.19
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
      - name: Download the exact verified tarballs
        uses: actions/download-artifact@v8
        with:
          name: acplugin-verified-tarballs
          path: tarballs
      - name: Create a clean Node 20 consumer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p consumer/src/skills/hello
          node --input-type=module - "$(pwd)/tarballs" "$(pwd)/consumer" <<'NODE'
          import fs from 'node:fs'
          import path from 'node:path'

          const [tarballDirectory, consumer] = process.argv.slice(2)
          const files = fs.readdirSync(tarballDirectory)
          const locate = pattern => path.join(tarballDirectory, files.find(file => pattern.test(file)))
          const dependencies = {
            '@tokenroll/acplugin': `file:${locate(/^tokenroll-acplugin-\d/)}`,
            '@tokenroll/acplugin-platform-claude-code': `file:${locate(/^tokenroll-acplugin-platform-claude-code-/)}`,
            '@tokenroll/acplugin-platform-codex': `file:${locate(/^tokenroll-acplugin-platform-codex-/)}`,
            '@tokenroll/acplugin-platform-cursor': `file:${locate(/^tokenroll-acplugin-platform-cursor-/)}`,
            '@tokenroll/acplugin-platform-antigravity': `file:${locate(/^tokenroll-acplugin-platform-antigravity-/)}`,
            '@tokenroll/acplugin-platform-opencode': `file:${locate(/^tokenroll-acplugin-platform-opencode-/)}`,
            '@tokenroll/acplugin-platform-pi': `file:${locate(/^tokenroll-acplugin-platform-pi-/)}`,
            '@tokenroll/acplugin-extension-hooks': `file:${locate(/^tokenroll-acplugin-extension-hooks-/)}`,
            '@tokenroll/acplugin-extension-mcp': `file:${locate(/^tokenroll-acplugin-extension-mcp-/)}`,
          }
          fs.writeFileSync(path.join(consumer, 'package.json'), `${JSON.stringify({
            name: 'acplugin-node-20-consumer',
            version: '0.0.0',
            private: true,
            type: 'module',
            dependencies,
          }, null, 2)}\n`)
          fs.writeFileSync(path.join(consumer, 'acplugin.config.ts'), `import { defineConfig } from '@tokenroll/acplugin';
          import claudeCode from '@tokenroll/acplugin-platform-claude-code';
          import codex from '@tokenroll/acplugin-platform-codex';

          export default defineConfig({
            name: 'node-20-consumer',
            version: '1.0.0',
            description: 'Node 20 packed consumer.',
            platforms: [claudeCode(), codex()],
          });
          `)
          fs.writeFileSync(path.join(consumer, 'src/skills/hello/SKILL.md'), `---
          description: Verify the Node 20 consumer.
          ---
          Build the packed public packages on Node 20.
          `)
          NODE
      - name: Install and execute the clean consumer
        working-directory: consumer
        run: |
          pnpm install --ignore-workspace
          node --input-type=module --eval "await Promise.all([import('@tokenroll/acplugin'), import('@tokenroll/acplugin-platform-claude-code'), import('@tokenroll/acplugin-platform-codex'), import('@tokenroll/acplugin-platform-cursor'), import('@tokenroll/acplugin-platform-antigravity'), import('@tokenroll/acplugin-platform-opencode'), import('@tokenroll/acplugin-platform-pi'), import('@tokenroll/acplugin-extension-hooks'), import('@tokenroll/acplugin-extension-mcp')])"
          pnpm exec acplugin build --json
